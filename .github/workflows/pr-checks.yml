name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  # The Version Packages pull request is pushed with the workflow's GITHUB_TOKEN, which starts no
  # `pull_request` run; .github/workflows/release.yml dispatches this workflow on its branch instead.
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A single, always-running job: requiring "check" in branch protection can never
# block a merge because of a skipped workflow. Turbo decides what is affected.
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Turborepo remote cache. Both are optional: without them Turbo runs uncached.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --affected needs history to diff against the base

      - uses: pnpm/action-setup@v4 # version comes from "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Find affected projects
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          BASE=""
          if [ "$EVENT" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE" # push to main: diff against the previous tip
          fi # else: new branch or rewritten history, check everything
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ]; then
            export TURBO_SCM_BASE="$BASE"
            echo "flag=--affected" >> "$GITHUB_OUTPUT"
            LIST=$(pnpm turbo ls --affected --output=json 2>/dev/null)
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            LIST=$(pnpm turbo ls --output=json 2>/dev/null)
          fi
          echo "$LIST"
          affected() {
            echo "$LIST" | node -e 'const t=require("fs").readFileSync(0,"utf8").replace(/^[^{]*/,"");process.exit(JSON.parse(t).packages.items.some((p)=>p.name===process.argv[1])?0:1)' "$1"
          }
          if affected mobile; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi
          if affected @foulee/contracts; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi
          # The contract check always compares with main: the previous tip on a push to main,
          # origin/main otherwise (whatever branch a pull request targets).
          if [ "$EVENT" = "push" ] && [ -n "$BASE" ]; then
            echo "compat_base=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "compat_base=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Expo doctor (mobile only)
        if: steps.affected.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor

      - name: Lint, typecheck, test
        env:
          TURBO_SCM_BASE: ${{ steps.affected.outputs.base }}
        run: pnpm turbo run lint typecheck test ${{ steps.affected.outputs.flag }}

      # An app build already on a phone must keep working after a BFF deploy, so changes inside /v1
      # are additive only (packages/contracts/README.md). Exports the v1 schemas to JSON Schema and
      # compares them with packages/contracts/json-schema/v1.json as committed on main; the tests
      # above already failed if that file is out of date on this branch.
      - name: Contract compatibility (contracts only)
        if: steps.affected.outputs.contracts == 'true'
        env:
          COMPAT_BASE: ${{ steps.affected.outputs.compat_base }}
        run: |
          pnpm turbo run build --filter=@foulee/contracts
          node packages/contracts/bin/check-compat.js --base "$COMPAT_BASE"

      # A pull request that changes apps/mobile or packages/contracts must add a changeset; one that
      # only changes the BFF, docs or tooling needs none. The script then runs `changeset status` to
      # check the changesets themselves. The Version Packages pull request (changeset-release/*)
      # consumes the changesets, so the script exempts it from both. Pushes to main and manual runs
      # have nothing to gate.
      - name: Changeset check
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ steps.affected.outputs.base }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: node packages/release-tools/bin/check-changeset.js --base "$BASE" --head-branch "$HEAD_BRANCH"

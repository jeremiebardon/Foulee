# Runs every Maestro flow (apps/mobile/.maestro) on an Android emulator, against the `e2e` build
# profile: the production variant with the e2e reset link enabled.
# Only on pushes to main that touch the app or a workspace package it depends on: a push that
# only changes apps/bff (or docs) does not start it. Paths are relative to the repository root.
# The native build is reused while the fingerprint is unchanged: the last e2e build with the same
# fingerprint is repacked with the new JavaScript, which takes minutes instead of a full build.
# Start it by hand from the Expo dashboard or, in apps/mobile:
#   pnpm dlx eas-cli@latest workflow:run .eas/workflows/e2e.yml
name: E2E (Android)

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - packages/contracts/**
      - packages/eslint-config/**
      - packages/tsconfig/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    # Same environment and variables as the e2e profile, so the hash matches its builds.
    environment: preview
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_E2E: 'true'

  get_android_build:
    name: Find a matching Android e2e build
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: e2e
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  repack_android:
    name: Repack the Android e2e build
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.get_android_build.outputs.build_id }}
      profile: e2e

  build_android:
    name: Build Android e2e
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: e2e

  maestro_android:
    name: Maestro flows on Android
    after: [repack_android, build_android]
    type: maestro
    # The Android emulator needs a nested-virtualization worker.
    runs_on: linux-large-nested-virtualization
    environment: preview
    params:
      build_id: ${{ needs.repack_android.outputs.build_id || needs.build_android.outputs.build_id }}
      flow_path: .maestro
